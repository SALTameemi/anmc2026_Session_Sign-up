<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANMC 2026 Sign-up Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c149b;--blue:#1766b3;--blue2:#2a79c9;--teal:#2aa0c6;--green:#2f8f1f;--red:#c0392b;--amber:#c98a00;--ink:#243b5e;--line:#dfeaf6;--bg:#eef5fc;--muted:#7790b0}
*{box-sizing:border-box}
body{margin:0;font-family:"Fredoka",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.banner{display:block;width:100%;max-width:980px;margin:0 auto}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}
.subt{text-align:center;color:var(--muted);font-size:13.5px;margin:10px 0 2px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.kpi{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px rgba(20,60,120,.06)}
.kpi .n{font-size:28px;font-weight:700;color:var(--navy);line-height:1}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:4px}
.bar{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0 2px}
.tabs{display:flex;gap:10px;margin:14px 0}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px;font-size:16px;font-weight:600;color:var(--blue);cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(23,102,179,.25)}
.refresh{display:block;margin:2px auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 16px;color:var(--blue);font-weight:600;cursor:pointer;font-family:inherit;font-size:14px}
.auto{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.blk{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:14px 0;box-shadow:0 6px 18px rgba(20,60,120,.06)}
.blk .bt{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.blk .bh{font-size:16px;font-weight:600;color:var(--navy);margin:1px 0 2px}
.blk .tm{font-size:13px;color:var(--teal);font-weight:600;margin-bottom:8px}
.row{padding:10px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:none}
.rtop{display:flex;align-items:center;gap:10px;cursor:pointer}
.rtop .rk{font-weight:600;color:var(--ink);font-size:15px}
.rtop .tr{font-size:12px;color:#64789b;font-weight:500}
.rtop .num{margin-left:auto;font-size:14px;font-weight:600;color:var(--muted);flex:none}
.pbar{height:9px;border-radius:999px;background:#e6edf6;overflow:hidden;margin-top:7px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal))}
.row.full .num{color:var(--red)}.row.full .pbar i{background:var(--red)}
.row.low .num{color:var(--amber)}
.names{margin:8px 0 0;font-size:13px;color:#3a4f71;display:none}
.names.show{display:block}
.nchip{display:inline-flex;align-items:center;gap:7px;background:#eef4ff;border:1px solid #d7e3fb;border-radius:999px;padding:4px 10px;margin:4px 6px 0 0;font-weight:500}
.nchip .mv{background:#fff;border:1px solid #cddbe4;border-radius:8px;font-size:11.5px;padding:2px 5px;color:var(--blue);font-family:inherit;cursor:pointer}
.nchip .rm{color:var(--red);cursor:pointer;font-weight:700;font-size:13px}
.editbar{display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0 2px;font-size:14px;font-weight:600;color:var(--ink)}
.editbar input{width:20px;height:20px}
.editnote{text-align:center;font-size:12px;color:var(--amber);font-weight:600;margin-bottom:4px}
.caret{font-size:12px;color:var(--blue);font-weight:600;margin-left:6px;flex:none}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:26px}
</style></head><body>

const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function RPC(fn,body){return fetch(U+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(r=>r.json());}
function REST(q){return fetch(U+'/rest/v1/'+q,{headers:{apikey:K,Authorization:'Bearer '+K}}).then(r=>r.ok?r.json():[]);}
let COUNTS={},ROWS=[],curDay=DATA.days[0].day,EDIT=false;
function cnt(bk,rk){return (COUNTS[bk]&&COUNTS[bk][rk])||0;}
const editMode=document.getElementById('editMode');
editMode.onchange=()=>{EDIT=editMode.checked;document.getElementById('editNote').style.display=EDIT?'block':'none';render();};

function load(){
  return Promise.all([
    RPC('session_counts').then(c=>{COUNTS=c||{};}),
    REST('session_signups?select=block_key,room_key,attendee_name,registrant_id,day&order=attendee_name').then(r=>{ROWS=Array.isArray(r)?r:[];})
  ]).then(render);
}
function buildTabs(){const t=document.getElementById('tabs');t.innerHTML='';
  DATA.days.forEach(d=>{const b=E('button',(d.day===curDay?'on':''),esc(d.label)+' · '+esc(d.date));b.onclick=()=>{curDay=d.day;buildTabs();render();};t.appendChild(b);});}
function kpis(){
  const total=ROWS.length;
  const byDay={};DATA.days.forEach(d=>byDay[d.day]=0);ROWS.forEach(r=>{byDay[r.day]=(byDay[r.day]||0)+1;});
  const uniq=new Set(ROWS.map(r=>r.registrant_id)).size;
  const host=document.getElementById('kpis');host.innerHTML='';
  const add=(n,l)=>{const k=E('div','kpi');k.innerHTML='<div class="n">'+n+'</div><div class="l">'+l+'</div>';host.appendChild(k);};
  add(uniq,'attendees booked');
  add(total,'total seat bookings');
  DATA.days.forEach(d=>add(byDay[d.day]||0,d.label+' bookings'));
}
function rowsFor(bk,rk){return ROWS.filter(r=>r.block_key===bk&&r.room_key===rk);}
function blockRooms(bk){const day=DATA.days.find(d=>d.blocks.some(b=>b.key===bk));if(!day)return[];const b=day.blocks.find(x=>x.key===bk);return b?b.rooms:[];}
function adminRemove(reg,bk,name){ if(!confirm('Remove '+name+' from this session?'))return;
  RPC('cancel_session',{p_reg:reg,p_block:bk}).then(()=>load());}
function adminMove(reg,name,day,bk,blabel,roomKey,label){
  RPC('admin_move_session',{p_reg:reg,p_name:name,p_day:day,p_block:bk,p_block_label:blabel,p_room:roomKey,p_room_label:label,p_cap:CAP}).then(res=>{
    if(res&&res.status==='full'){alert(roomKey+' is full ('+CAP+').');}
    load();});}
function fillNames(nm,bk,rk,blk){
  const rows=rowsFor(bk,rk);
  if(!rows.length){nm.innerHTML='<i style="color:#9fb2cc">no bookings yet</i>';return;}
  nm.innerHTML='';
  rows.forEach(row=>{
    const chip=E('span','nchip');
    chip.appendChild(E('b',null,esc(row.attendee_name||row.registrant_id)));
    if(EDIT){
      const sel=document.createElement('select');sel.className='mv';
      sel.innerHTML='<option value="">move…</option>'+blk.rooms.filter(r=>r.roomKey!==rk).map(r=>'<option value="'+esc(r.roomKey)+'">→ '+esc(r.roomKey)+'</option>').join('');
      sel.onchange=()=>{const rk2=sel.value;if(!rk2)return;const r2=blk.rooms.find(x=>x.roomKey===rk2);
        adminMove(row.registrant_id,row.attendee_name,blk._day,bk,blk.title,rk2,(rk2+(r2&&r2.track?' · '+r2.track:'')));};
      chip.appendChild(sel);
      const x=E('span','rm','✕');x.onclick=()=>adminRemove(row.registrant_id,bk,row.attendee_name||row.registrant_id);
      chip.appendChild(x);
    }
    nm.appendChild(chip);
  });
}
function render(){
  kpis();
  const host=document.getElementById('blocks');host.innerHTML='';
  const day=DATA.days.find(d=>d.day===curDay);
  day.blocks.forEach(blk=>{
    blk._day=day.day;
    const card=E('div','blk');
    card.appendChild(E('div','bt',esc(blk.title)));
    if(blk.time)card.appendChild(E('div','tm',esc(blk.time)));
    blk.rooms.forEach(r=>{
      const n=cnt(blk.key,r.roomKey);const full=n>=CAP;const low=n>0&&n<10;
      const row=E('div','row'+(full?' full':'')+(low?' low':''));
      const pct=Math.min(100,Math.round(n/CAP*100));
      row.innerHTML='<div class="rtop"><div><div class="rk">'+esc(r.roomKey)+(r.track?' <span class="tr">· '+esc(r.track)+'</span>':'')+'</div></div>'+
        '<div class="num">'+n+'/'+CAP+(full?' · FULL':'')+'</div><span class="caret">▸</span></div>'+
        '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="names"></div>';
      const top=row.querySelector('.rtop'),nm=row.querySelector('.names'),car=row.querySelector('.caret');
      top.onclick=()=>{const open=nm.classList.toggle('show');car.textContent=open?'▾':'▸';
        if(open){fillNames(nm,blk.key,r.roomKey,blk);}};
      if(EDIT){nm.classList.add('show');car.textContent='▾';fillNames(nm,blk.key,r.roomKey,blk);}
      card.appendChild(row);
    });
    host.appendChild(card);
  });
}
document.getElementById('refresh').onclick=()=>load();
buildTabs();load();
setInterval(load,20000);
</script></body></html>
